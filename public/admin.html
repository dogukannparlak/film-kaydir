<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Kaydır · Yönetim</title>
<link rel="stylesheet" href="css/yonetim.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><img src="icons/logo.svg" alt="" width="28" height="28"> Kaydır <span>Yönetim</span></a>
  <div class="top-right">
    <div class="seg" id="days"><button data-d="7">7 gün</button><button data-d="30" class="on">30 gün</button><button data-d="90">90 gün</button></div>
    <button class="btn" id="refresh">Yenile</button>
    <span class="who" id="who"></span>
  </div>
</header>

<main id="app">
  <section class="card login hidden" id="login">
    <h2>Giriş</h2>
    <p class="muted">Yalnız admin hesabı görebilir.</p>
    <input id="email" type="email" placeholder="E-posta" autocomplete="email">
    <input id="pass" type="password" placeholder="Şifre" autocomplete="current-password">
    <button class="btn primary" id="signin">Giriş yap</button>
    <p class="err" id="loginErr"></p>
  </section>

  <div id="dash" class="hidden">
    <div class="sources" id="sources"></div>

    <section class="kpis" id="kpis"></section>

    <section class="grid2">
      <div class="card"><h3>Günlük ziyaretçi <small>üç kaynak</small></h3><div class="chart"><canvas id="cVisits"></canvas></div></div>
      <div class="card"><h3>Worker istekleri <small>Cloudflare · istek ve hata</small></h3><div class="chart"><canvas id="cWorker"></canvas></div></div>
    </section>

    <section class="grid3" id="tops"></section>

    <section class="card">
      <h3>Hesaplar <small id="usersMeta"></small></h3>
      <div class="table-wrap"><table id="users"><thead><tr><th>E-posta</th><th>Kayıt</th><th>Son giriş</th><th>Liste öğesi</th><th>Son değişiklik</th><th>Anahtar</th><th>Rol</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>

    <section class="grid2">
      <div class="card"><h3>Veritabanı <small>Supabase</small></h3><div id="db"></div></div>
      <div class="card"><h3>Paneller</h3><div class="links" id="links"></div></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" integrity="sha384-Sse/HDqcypGpyTDpvZOJNnG0TT3feGQUkF9H+mnRvic+LjR+K1NhTt8f51KIQ3v3" crossorigin="anonymous"></script>
<script src="js/yonetim.js"></script>
</body>
</html>
